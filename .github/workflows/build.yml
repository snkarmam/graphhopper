name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

# Needed so the workflow can commit the updated mutation-score.txt
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['24', '25-ea']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-


    ####### Notre modification commence ici ###########

      - name: Build and unit tests
        run: mvn -B clean test

      - name: Run mutation tests
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      - name: Extract mutation score
        id: mutation
        run: |
          SCORE=$(grep -RhoP 'mutationCoverage="\K[0-9.]+' target/pit-reports || echo "")
          SCORE=$(echo "$SCORE" | head -n1)

          if [ -z "$SCORE" ]; then
            echo "Mutation score not found in PIT reports"
            exit 1
          fi

          echo "Found mutation score: $SCORE"
          echo "mutation_score=$SCORE" >> "$GITHUB_OUTPUT"

      - name: Compare mutation score with baseline
        run: |
          BASELINE=$(cat mutation-score.txt 2>/dev/null || echo "0")
          CURR_SCORE=${{ steps.mutation.outputs.mutation_score }}

          echo "Baseline score: $BASELINE"
          echo "Current score:  $CURR_SCORE"

          if ! command -v bc >/dev/null 2>&1; then
            echo "bc is not available on this runner"
            exit 1
          fi

          # If current score is less than baseline → fail the build
          if (( $(echo "$CURR_SCORE < $BASELINE" | bc -l) )); then
            echo "❌ Mutation score decreased compared to previous baseline"
            exit 1
          fi

          echo "✅ Mutation score did not decrease (>= baseline)"

      - name: Update mutation-score.txt with latest score
        # Always update the file in the workspace with the latest score,
        # even if the comparison step failed
        if: always()
        run: |
          CURR_SCORE=${{ steps.mutation.outputs.mutation_score }}

          if [ -z "$CURR_SCORE" ]; then
            echo "No current mutation score found, skipping update of mutation-score.txt"
            exit 0
          fi

          echo "Writing latest mutation score ($CURR_SCORE) to mutation-score.txt"
          echo "$CURR_SCORE" > mutation-score.txt

      - name: Commit updated baseline (on success only)
        # Only persist the new baseline in the repo when the job has succeeded
        if: success()
        run: |
          # Configure git identity for the bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add mutation-score.txt

          # If there is no diff, don't commit
          if git diff --cached --quiet; then
            echo "No changes in mutation-score.txt, nothing to commit."
            exit 0
          fi

          CURR_SCORE=${{ steps.mutation.outputs.mutation_score }}
          echo "Committing updated mutation baseline: $CURR_SCORE"

          git commit -m "Update mutation baseline to $CURR_SCORE"
          git push


########### notre blague commence ici ############

  rickroll-on-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Rick Roll on failure
        uses: TejasvOnly/random-rickroll@v1.0
        with:
          percentage: 100
          message: "Les tests ont échoué, never gonna give you up."
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
