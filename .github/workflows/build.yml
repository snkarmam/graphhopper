name: Build and Test
# to

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['24', '25-ea']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install bc
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: Build and unit tests (no PIT)
        if: matrix.java-version != '24'
        run: mvn -pl web-api -am -B clean test

      - name: Build, unit tests and mutation tests (core, Java 24)
        if: matrix.java-version == '24'
        run: mvn -pl core -am -B clean test org.pitest:pitest-maven:mutationCoverage


      - name: Debug PIT report paths
        if: matrix.java-version == '24'
        run: |
          echo "PIT report directories:"
          find . -type d -name "pit-reports" -print || true
          echo "PIT index.html files:"
          find . -path "*pit-reports*/index.html" -print || true

      - name: Extract mutation score
        if: matrix.java-version == '24'
        id: mutation
        run: |
          echo "=== Detecting PIT report index.html ==="

          # On privilégie core
          if [ -f core/target/pit-reports/index.html ]; then
            REPORT_FILE="core/target/pit-reports/index.html"
          elif [ -f web-api/target/pit-reports/index.html ]; then
            REPORT_FILE="web-api/target/pit-reports/index.html"
          else
            REPORT_FILE=$(find . -path "*pit-reports/index.html" -print | head -n1 || true)
          fi

          echo "Using PIT report: $REPORT_FILE"

          sed -n '/<h3>Project Summary<\/h3>/,/<\/table>/p' "$REPORT_FILE" > /tmp/project_summary.html
          RAW_PCTS=$(grep -o '[0-9]\+%' /tmp/project_summary.html || true)

          echo "Percents in Project Summary (in order):"
          echo "$RAW_PCTS"

          SCORE=$(echo "$RAW_PCTS" | sed -n '2p' | tr -d '%')
          if [ -z "$SCORE" ]; then
            SCORE=$(echo "$RAW_PCTS" | tail -n1 | tr -d '%')
          fi

          if [ -z "$SCORE" ]; then
            echo "Mutation coverage percent not found in Project Summary of $REPORT_FILE"
            exit 1
          fi

          echo "Final mutation coverage (Project Summary, percent only): $SCORE%"
          echo "mutation_score=$SCORE" >> "$GITHUB_OUTPUT"



      - name: Compare mutation score with previous run
        if: matrix.java-version == '24'
        run: |
          # baseline = score stocké dans le repo (dernier run)
          BASELINE=$(cat mutation-score.txt 2>/dev/null || echo "0")
          CURR_SCORE="${{ steps.mutation.outputs.mutation_score }}"

          echo "Baseline score (previous run): $BASELINE"
          echo "Current score              : $CURR_SCORE"

          # Vérifier que les deux scores sont numériques
          if ! echo "$CURR_SCORE" | grep -Eq '^[0-9]+([.][0-9]+)?$'; then
            echo "Error: current mutation score '$CURR_SCORE' is not numeric."
            exit 1
          fi
          if ! echo "$BASELINE" | grep -Eq '^[0-9]+([.][0-9]+)?$'; then
            echo "Error: baseline mutation score '$BASELINE' is not numeric."
            exit 1
          fi

          if command -v bc >/dev/null 2>&1; then
            RES=$(echo "$CURR_SCORE < $BASELINE" | bc -l)
            if [ "$RES" -eq 1 ]; then
              echo "Mutation score decreased compared to previous run"
              exit 1
            else
              echo "Mutation score did not decrease"
            fi
          else
            echo "bc is not available"
            exit 1
          fi

      - name: Save current mutation score
        if: matrix.java-version == '24'
        run: echo "${{ steps.mutation.outputs.mutation_score }}" > mutation-score.txt

  rickroll-on-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Rick Roll in logs
        run: |
          echo "Les tests ont échoué, never gonna give you up."
          echo "https://www.youtube.com/watch?v=dQw4w9WgXcQ"

      - name: Rick Roll in Summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### Tests en échec = Rickroll automatique

          Les tests ont échoué, never gonna give you up.

          ![Rickroll](https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif)

          [Voir la vidéo complète](https://www.youtube.com/watch?v=dQw4w9WgXcQ)
          EOF

      - name: Rick Roll comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '### Tests en échec = Rickroll automatique',
              '',
              'Les tests ont échoué, never gonna give you up.',
              '',
              '![Rickroll](https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif)',
              '',
              '[Voir la vidéo complète](https://www.youtube.com/watch?v=dQw4w9WgXcQ)'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
