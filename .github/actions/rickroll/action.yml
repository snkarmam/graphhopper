name: "Rickroll on failure"
description: "Affiche un Rickroll dans les logs, le résumé et la PR en cas d'échec"

inputs:
  github_token:
    description: "GitHub token utilisé pour commenter sur les PR"
    required: true

runs:
  using: "composite"
  steps:
    - name: Rick Roll in logs
      shell: bash
      run: |
        echo "Les tests ont échoué, never gonna give you up."
        echo "https://www.youtube.com/watch?v=dQw4w9WgXcQ"

    - name: Rick Roll in Summary
      shell: bash
      run: |
        cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
        ### Tests en échec 

        Les tests ont échoué, never gonna give you up.

        ![Rickroll](https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif)

        [Voir la vidéo complète](https://www.youtube.com/watch?v=dQw4w9WgXcQ)
        EOF

    - name: Rick Roll comment on PR
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const body = [
            '### Tests en échec',
            '',
            'Les tests ont échoué, never gonna give you up.',
            '',
            '![Rickroll](https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif)',
            '',
            '[Voir la vidéo complète](https://www.youtube.com/watch?v=dQw4w9WgXcQ)'
          ].join('\n');

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body
          });
